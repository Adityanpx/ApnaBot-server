<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect WhatsApp</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
  }
  [hidden] {
    display: none !important;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 16px 32px;
    box-sizing: border-box;
    text-align: left;
  }
  #chooser {
    width: 100%;
    max-width: 480px;
  }
  .question {
    font-size: 17px;
    font-weight: 600;
    color: #222;
    margin: 0 0 14px;
    line-height: 1.35;
  }
  .choices {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .choice {
    background: #fff;
    border: 2px solid #d5d9dd;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: #222;
    text-align: left;
    cursor: pointer;
    min-height: 48px;
  }
  .choice .label {
    display: block;
    font-weight: 600;
  }
  .choice .hint {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: #667;
  }
  .choice[aria-pressed="true"] {
    border-color: #25D366;
    background: #f1fbf5;
  }
  .checklist {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 16px;
    padding: 12px 14px;
    border: 1px solid #d5d9dd;
    border-radius: 10px;
    background: #fff;
    color: #444;
    font-size: 14px;
  }
  .checklist p {
    margin: 0 0 6px;
    font-weight: 600;
    color: #222;
  }
  .checklist ul {
    margin: 0;
    padding-left: 20px;
  }
  .checklist li {
    margin-bottom: 4px;
  }
  .info {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 16px;
    padding: 12px 14px;
    background: #f6f7f8;
    border-radius: 10px;
    color: #444;
    font-size: 14px;
    text-align: left;
    white-space: pre-line;
  }
  .btn {
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 480px;
    min-height: 48px;
  }
  .btn:disabled {
    opacity: 0.6;
  }
  .btn.secondary {
    background: #555;
  }
  .btn + .btn {
    margin-top: 10px;
  }
  .status {
    margin-top: 16px;
    color: #555;
    font-size: 14px;
    width: 100%;
    max-width: 480px;
  }
</style>
</head>
<body>
<div id="fb-root"></div>
<div class="wrap">
  <div id="chooser">
    <p class="question">Which WhatsApp number do you want customers to message?</p>
    <div class="choices">
      <button type="button" id="choiceYes" class="choice" aria-pressed="false"><span class="label">It's on the WhatsApp Business app</span><span class="hint">You use this number in the WhatsApp Business app today.</span></button>
      <button type="button" id="choiceNo" class="choice" aria-pressed="false"><span class="label">It's a new number / not on WhatsApp</span><span class="hint">A fresh number you'll verify by SMS or call.</span></button>
      <button type="button" id="choicePersonal" class="choice" aria-pressed="false"><span class="label">It's on normal (personal) WhatsApp</span><span class="hint">The green WhatsApp app. It needs a change first.</span></button>
    </div>
    <div id="checklist" class="checklist" hidden>
      <p>Before you connect, check:</p>
      <ul id="checklistItems"></ul>
    </div>
    <div id="info" class="info" hidden></div>
  </div>
  <button id="connectBtn" class="btn" disabled hidden>Connect WhatsApp</button>
  <button id="retryBtn" class="btn secondary" hidden>Retry</button>
  <div id="status" class="status">Loading...</div>
</div>

<script>
(function () {
  var TIMEOUT_MS = 30000;

  var connectBtn = document.getElementById('connectBtn');
  var retryBtn = document.getElementById('retryBtn');
  var statusEl = document.getElementById('status');
  var infoEl = document.getElementById('info');
  var checklistEl = document.getElementById('checklist');
  var checklistItemsEl = document.getElementById('checklistItems');
  var cards = {
    coexistence: document.getElementById('choiceYes'),
    cloud_api: document.getElementById('choiceNo'),
    personal: document.getElementById('choicePersonal')
  };

  // Wording mirrors apnabot-web WhatsAppConnectPanel.tsx.
  var INFO_TEXT = {
    coexistence:
      'In the Meta window, choose the option to connect your existing WhatsApp Business app and type that number. ' +
      'You\'ll get a code and a message inside the WhatsApp Business app to confirm — no SMS or call.\n\n' +
      'If Meta asks for an SMS or call code while connecting a Business-app number, stop and contact us.\n\n' +
      'Don\'t choose \'Test Number\' or \'virtual number\'.',
    cloud_api:
      'In the Meta window, choose \'Enter a new phone number\', type the number and verify it by SMS or call. ' +
      'The number must not be registered on WhatsApp.\n\n' +
      'Don\'t choose \'Test Number\' or \'virtual number\'.',
    personal:
      'Coexistence only works with the WhatsApp Business app. Either switch this number to the ' +
      'WhatsApp Business app first (then choose "It\'s on the WhatsApp Business app"), or delete the WhatsApp account on that ' +
      'number and choose "It\'s a new number / not on WhatsApp".'
  };

  var COEXISTENCE_CHECKLIST = [
    'WhatsApp Business app version 2.24.17 or newer.',
    'You\'ve used this number in the Business app for at least 7 days.',
    'The number was never connected to another provider or an old ApnaBot link (remove that first).',
    'You\'re an admin of your Meta business and it has a Facebook Page.',
    'Keep your phone nearby with the Business app open.'
  ];

  // Plain-language versions of known failures (mirrors apnabot-web wa-connect-errors.ts).
  // Matched on message text; an unmatched message is shown unchanged. The raw Meta
  // text stays in the debug stream.
  var FRIENDLY_RULES = [
    {
      test: /344103[8]|344104[1]|already connected to another business/i,
      message: 'This number is already linked to another provider, another business or an old ApnaBot link. ' +
        'Remove it there first (in the WhatsApp Business app: Settings → Account → Business Platform → Disconnect Account), then tap Retry.'
    },
    {
      test: /3441045/,
      message: 'WhatsApp says this number can\'t be connected right now. Check that the Business app is updated (2.24.17 or newer) ' +
        'and that you\'ve used this number in the Business app for at least 7 days, then try again.'
    },
    {
      test: /couldn't find your WhatsApp account yet/i,
      message: 'We couldn\'t find your WhatsApp account yet. Wait a minute, keep the Business app open, then tap Retry.'
    },
    {
      test: /didn't finish sending your account details/i,
      message: 'WhatsApp took too long to finish. Keep the Business app open on your phone and tap Retry.'
    }
  ];

  var META_CONFIG_ID = null;
  var sdkReady = false;
  var chosen = null; // 'coexistence' | 'cloud_api' | 'personal' - guidance only, never changes FB.login

  // One signup attempt. Meta gives us the auth code (FB.login callback) and the
  // account IDs (postMessage event) separately, in no guaranteed order.
  function newSession() {
    return {
      active: false, code: null, wabaId: null, phoneNumberId: null,
      metaBusinessId: null, primaryWaacIds: [], isOnBizApp: null,
      hint: null, done: false, failed: false, timer: null
    };
  }
  var session = newSession();

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function friendlyError(message) {
    for (var i = 0; i < FRIENDLY_RULES.length; i++) {
      if (FRIENDLY_RULES[i].test.test(message)) return FRIENDLY_RULES[i].message;
    }
    return message;
  }

  // Meta's primary_waac_ids shape is undocumented: strings/numbers are ids, objects
  // are read by waba_id / id. Numeric only, deduped, capped at 10 (as the web does).
  function wabaCandidates(raw) {
    var list = Array.isArray(raw) ? raw : (raw === undefined || raw === null ? [] : [raw]);
    var ids = [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var v = item && typeof item === 'object' ? (item.waba_id !== undefined && item.waba_id !== null ? item.waba_id : item.id) : item;
      var id = typeof v === 'number' ? String(v) : v;
      if (typeof id === 'string' && /^[0-9]+$/.test(id) && ids.indexOf(id) === -1) ids.push(id);
    }
    return ids.slice(0, 10);
  }

  function nonEmptyString(v) {
    return typeof v === 'string' && v ? v : null;
  }

  // The auth code is single-use and secret: never forward it in debug payloads.
  function redactCode(value) {
    if (value === undefined) return value;
    try {
      var v = typeof value === 'string' ? JSON.parse(value) : value;
      return JSON.parse(JSON.stringify(v, function (key, val) {
        return key === 'code' ? '[redacted]' : val;
      }));
    } catch (e) {
      return value;
    }
  }

  function sendToApp(payload) {
    if (window.ApnaBotBridge && typeof window.ApnaBotBridge.postMessage === 'function') {
      window.ApnaBotBridge.postMessage(JSON.stringify(payload));
    }
  }

  function sendError(message) {
    var friendly = friendlyError(message);
    setStatus(friendly);
    sendToApp({ error: friendly });
  }

  function isFacebookOrigin(origin) {
    var host;
    try {
      host = new URL(origin).hostname;
    } catch (e) {
      return false;
    }
    return host === 'facebook.com' || /\.facebook\.com$/.test(host);
  }

  function canConnect() {
    return sdkReady && (chosen === 'coexistence' || chosen === 'cloud_api');
  }

  function refreshControls() {
    connectBtn.hidden = !(chosen === 'coexistence' || chosen === 'cloud_api');
    connectBtn.disabled = !canConnect() || session.active;
  }

  function choose(kind) {
    if (session.active) return;
    chosen = kind;
    Object.keys(cards).forEach(function (k) {
      cards[k].setAttribute('aria-pressed', k === kind ? 'true' : 'false');
    });
    infoEl.textContent = INFO_TEXT[kind];
    infoEl.hidden = false;
    checklistEl.hidden = kind !== 'coexistence';
    retryBtn.hidden = true;
    if (kind === 'personal') {
      setStatus('');
    } else {
      setStatus(sdkReady ? 'Tap the button below to connect your WhatsApp Business number.' : 'Loading...');
    }
    refreshControls();
  }

  checklistItemsEl.innerHTML = '';
  COEXISTENCE_CHECKLIST.forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    checklistItemsEl.appendChild(li);
  });

  function clearTimer() {
    if (session.timer) {
      clearTimeout(session.timer);
      session.timer = null;
    }
  }

  // Ends the attempt with an error and offers Retry. First failure wins, so a
  // specific message (CANCEL step, ERROR text) is never overwritten by a
  // generic one.
  function fail(message) {
    if (!session.active || session.done || session.failed) return;
    session.failed = true;
    clearTimer();
    sendError(message);
    retryBtn.hidden = false;
  }

  // Cloud API (plain FINISH) needs waba_id and phone_number_id. A coexistence
  // finish carries no waba_id, so phone_number_id is enough: the server resolves
  // the WABA.
  function idsReady() {
    if (!session.hint) return false;
    if (session.hint === 'coexistence') return !!session.phoneNumberId;
    return !!(session.wabaId && session.phoneNumberId);
  }

  // Sends to the app once, when BOTH the auth code and the account IDs are in.
  function maybeComplete() {
    if (!session.active || session.done || session.failed) return;
    var haveIds = idsReady();

    if (session.code && haveIds) {
      session.done = true;
      clearTimer();
      if ((chosen === 'coexistence' || chosen === 'cloud_api') && chosen !== session.hint) {
        console.warn('[whatsapp-connect] user chose ' + chosen + ' but Meta reported ' + session.hint + '; sending ' + session.hint);
      }
      setStatus('Connecting...');
      var payload = {
        code: session.code,
        wabaId: session.wabaId,
        phoneNumberId: session.phoneNumberId,
        onboardingType: session.hint
      };
      // Extras only when Meta sent them (the server drops non-numeric / non-boolean values).
      if (session.metaBusinessId) payload.metaBusinessId = session.metaBusinessId;
      if (session.primaryWaacIds.length) payload.primaryWaacIds = session.primaryWaacIds;
      if (session.isOnBizApp !== null) payload.isOnBizApp = session.isOnBizApp;
      sendToApp(payload);
      return;
    }

    // One half has arrived; don't wait forever for the other.
    if ((session.code || session.wabaId || session.phoneNumberId) && !session.timer) {
      setStatus('Finishing...');
      session.timer = setTimeout(function () {
        session.timer = null;
        fail("WhatsApp didn't finish sending your account details. Please retry.");
      }, TIMEOUT_MS);
    }
  }

  window.addEventListener('message', function (event) {
    var debugData = redactCode(event.data);
    console.log('[DEBUG raw message]', event.origin, debugData);
    sendToApp({ debug: true, origin: event.origin, data: debugData });

    if (!event.origin || !isFacebookOrigin(event.origin)) {
      return;
    }

    var data;
    try {
      data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    } catch (e) {
      return;
    }

    if (!data || data.type !== 'WA_EMBEDDED_SIGNUP' || !session.active) {
      return;
    }

    var info = data.data || {};

    if (data.event === 'FINISH' || data.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
      // Plain FINISH = Cloud API signup; the WhatsApp Business app onboarding
      // event = coexistence. Meta's event, not the guidance choice, is the truth.
      session.hint = data.event === 'FINISH' ? 'cloud_api' : 'coexistence';
      session.wabaId = nonEmptyString(info.waba_id);
      session.phoneNumberId = nonEmptyString(info.phone_number_id);
      session.metaBusinessId = nonEmptyString(info.business_id);
      session.primaryWaacIds = wabaCandidates(info.primary_waac_ids);
      session.isOnBizApp = typeof info.is_on_biz_app === 'boolean' ? info.is_on_biz_app : null;
      maybeComplete();
    } else if (data.event === 'FINISH_ONLY_WABA') {
      fail('WhatsApp Business Account created, but no phone number was added. Please retry and add a number.');
    } else if (data.event === 'CANCEL') {
      if (info.error_message) {
        fail('WhatsApp signup failed: ' + info.error_message);
      } else if (info.current_step) {
        fail('WhatsApp signup was cancelled at step: ' + info.current_step + '.');
      } else {
        fail('WhatsApp signup was cancelled.');
      }
    } else if (data.event === 'ERROR') {
      fail(info.error_message || 'WhatsApp signup failed.');
    }
  });

  function launchSignup() {
    if (!window.FB) {
      sendError('Facebook SDK failed to load.');
      return;
    }
    if (!canConnect()) return;

    session = newSession();
    session.active = true;
    retryBtn.hidden = true;
    refreshControls();
    setStatus('Opening WhatsApp signup...');

    window.FB.login(function (response) {
      var debugResponse = redactCode(response);
      console.log('[DEBUG FB.login response]', JSON.stringify(debugResponse));
      sendToApp({ debug: true, fbLoginResponse: debugResponse });

      if (response && response.authResponse && response.authResponse.code) {
        session.code = response.authResponse.code;
        maybeComplete();
      } else {
        // A CANCEL / ERROR message usually arrives right around this callback
        // and says why; give it a moment so its message wins over this generic one.
        setTimeout(function () {
          fail('WhatsApp signup was not completed.');
        }, 1500);
      }
    }, {
      config_id: META_CONFIG_ID,
      response_type: 'code',
      override_default_response_type: true,
      scope: 'whatsapp_business_management,whatsapp_business_messaging',
      // Embedded Signup v5: coexistence is on by default - no featureType / sessionInfoVersion.
      extras: {
        setup: {},
        version: 'v5'
      }
    });
  }

  function retry() {
    clearTimer();
    session = newSession();
    retryBtn.hidden = true;
    setStatus('Tap the button below to try again.');
    refreshControls();
  }

  cards.coexistence.addEventListener('click', function () { choose('coexistence'); });
  cards.cloud_api.addEventListener('click', function () { choose('cloud_api'); });
  cards.personal.addEventListener('click', function () { choose('personal'); });
  connectBtn.addEventListener('click', launchSignup);
  retryBtn.addEventListener('click', retry);

  setStatus('Choose the option that matches your number.');

  fetch('/api/public/whatsapp-embedded-signup-config')
    .then(function (res) { return res.json(); })
    .then(function (json) {
      if (!json.success || !json.data || !json.data.appId || !json.data.configId) {
        throw new Error('Missing config');
      }

      META_CONFIG_ID = json.data.configId;

      window.fbAsyncInit = function () {
        window.FB.init({
          appId: json.data.appId,
          xfbml: true,
          version: 'v25.0'
        });
        sdkReady = true;
        refreshControls();
        if (chosen === 'coexistence' || chosen === 'cloud_api') {
          setStatus('Tap the button below to connect your WhatsApp Business number.');
        }
      };

      (function (d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = 'https://connect.facebook.net/en_US/sdk.js';
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'facebook-jssdk'));
    })
    .catch(function () {
      sendError('Unable to load WhatsApp signup configuration.');
    });
}());
</script>
</body>
</html>
